<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防災ファイル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .word-break-all {
      word-break: break-all;
      overflow-wrap: anywhere;
    }
    .tab-btn.active {
      color: #10b981;
      border-bottom: 2px solid #10b981;
    }
    .bg-dark-card {
      background-color: #1e293b;
    }
    .bg-dark-input {
      background-color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-0 sm:p-4">

  <!-- ログイン画面 (初期表示で確実に表示) -->
  <div id="login-container" class="fixed inset-0 bg-[#0f172a] z-50 flex flex-col items-center justify-center p-4">
    <div class="bg-dark-card p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-700/50">
      <div class="text-4xl mb-4 text-emerald-400">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="text-2xl font-bold mb-2 text-white">防災ファイル</h1>
      <p class="text-slate-400 text-sm mb-6">ご利用にはログインが必要です</p>
      
      <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-4 rounded-xl border border-slate-600 transition shadow-lg cursor-pointer">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Googleでログイン
      </button>
    </div>
  </div>

  <!-- ログイン後メイン画面 (初期状態は非表示) -->
  <div id="app-container" class="hidden flex-1 flex flex-col max-w-3xl w-full min-h-screen">
    
    <!-- ヘッダー -->
    <header class="p-4 flex justify-between items-center border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500/20 p-2 rounded-xl text-emerald-400">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white leading-tight">防災ファイル</h1>
          <p id="user-display-name" class="text-xs text-slate-400"></p>
        </div>
      </div>
      <button id="logout-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
        <i class="fa-solid fa-right-from-bracket"></i> ログアウト
      </button>
    </header>

    <!-- タブナビゲーション -->
    <nav class="flex border-b border-slate-800 text-sm font-medium text-slate-400 overflow-x-auto">
      <button class="tab-btn px-4 py-3 flex items-center gap-2 text-center active whitespace-nowrap" onclick="switchTab('goods')">
        <i class="fa-solid fa-boxes-packing"></i> 備蓄品リスト
      </button>
      <button class="tab-btn px-4 py-3 flex items-center gap-2 text-center whitespace-nowrap" onclick="switchTab('evacuation')">
        <i class="fa-solid fa-person-shelter"></i> 避難所
      </button>
      <button class="tab-btn px-4 py-3 flex items-center gap-2 text-center whitespace-nowrap" onclick="switchTab('tasks')">
        <i class="fa-solid fa-list-check"></i> 課題リスト
      </button>
      <button class="tab-btn px-4 py-3 flex items-center gap-2 text-center whitespace-nowrap" onclick="switchTab('contacts')">
        <i class="fa-solid fa-phone"></i> 緊急連絡先
      </button>
    </nav>

    <!-- メインコンテンツ領域 -->
    <main class="p-4 flex-1">

      <!-- 1. 備蓄品リスト -->
      <section id="tab-goods" class="tab-content space-y-4">
        <div class="bg-dark-card p-5 rounded-2xl border border-slate-700/50 flex justify-between items-center">
          <div>
            <h2 class="text-lg font-bold text-white">備蓄品チェックリスト</h2>
            <p class="text-xs text-slate-400 mt-0.5">水・食料・防災用品の準備状況</p>
          </div>
          <div class="text-right">
            <span id="goods-count" class="text-2xl font-bold text-emerald-400">3/5</span>
            <span class="block text-xs text-slate-400">準備完了</span>
          </div>
        </div>

        <div class="flex gap-2">
          <input type="text" id="new-goods-input" placeholder="新しい備蓄品（例：保存水 2L×6本）" class="flex-1 bg-dark-card border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
          <button onclick="addGoodsItem()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-sm transition">
            追加
          </button>
        </div>

        <div id="goods-list" class="space-y-2"></div>
      </section>

      <!-- 2. 避難所 Tab -->
      <section id="tab-evacuation" class="tab-content hidden space-y-3">
        <div class="bg-dark-card p-5 rounded-2xl border border-slate-700/50 space-y-3">
          <h2 class="text-lg font-bold text-white mb-2 flex items-center gap-2">
            <i class="fa-solid fa-location-dot text-emerald-400"></i> 指定避難所
          </h2>
          <div class="p-3 bg-slate-900/50 rounded-xl border border-slate-800">
            <p class="font-bold text-white">〇〇小学校体育館（一次避難所）</p>
            <p class="text-xs text-slate-400 mt-1">住所: 福岡市〇〇区〇〇1-2-3</p>
            <p class="text-xs text-slate-400">徒歩: 約8分 (650m)</p>
          </div>
          <div class="p-3 bg-slate-900/50 rounded-xl border border-slate-800">
            <p class="font-bold text-white">〇〇公園（広域避難場所）</p>
            <p class="text-xs text-slate-400 mt-1">住所: 福岡市〇〇区〇〇4-5</p>
            <p class="text-xs text-slate-400">徒歩: 約15分 (1.2km)</p>
          </div>
        </div>
      </section>

      <!-- 3. 課題リスト Tab -->
      <section id="tab-tasks" class="tab-content hidden space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-list-check text-emerald-400"></i> 防災課題・事前準備
          </h2>
          <button onclick="openTaskModal()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-bold px-3 py-2 rounded-xl transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> 課題を追加
          </button>
        </div>

        <div id="tasks-list" class="space-y-2"></div>
      </section>

      <!-- 4. 緊急連絡先 Tab -->
      <section id="tab-contacts" class="tab-content hidden space-y-3">
        <div class="bg-dark-card p-5 rounded-2xl border border-slate-700/50 space-y-3">
          <h2 class="text-lg font-bold text-white mb-2">緊急連絡先</h2>
          <div class="p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm font-semibold">
            警察: 110 / 消防・救急: 119 / 海上保安庁: 118
          </div>
          <div class="p-3 bg-slate-900/50 rounded-xl border border-slate-800">
            <p class="font-bold text-white text-sm">災害用伝言ダイヤル</p>
            <p class="text-xs text-slate-400 mt-1">「171」に電話してガイダンスに従ってください。</p>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- 課題追加モーダル -->
  <div id="task-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-dark-card rounded-2xl p-6 w-full max-w-md border border-slate-700 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-white">防災課題・事前準備を追加</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">タイトル</label>
          <input type="text" id="task-title" class="w-full bg-dark-input border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="例: 家具の固定用金具を購入">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">詳細メモ</label>
          <textarea id="task-detail" rows="3" class="w-full bg-dark-input border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="メモや詳細手順"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">関連URL</label>
          <input type="url" id="task-url" class="w-full bg-dark-input border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="https://example.com">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeTaskModal()" class="px-4 py-2 text-xs text-slate-400 hover:text-white transition">キャンセル</button>
        <button onclick="saveTask()" class="px-4 py-2 text-xs bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition">保存</button>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCFBybW0jJD2iPm0-x1FDhH5qbWFBFXeSE",
      authDomain: "kakeibo-cea1a.firebaseapp.com",
      projectId: "kakeibo-cea1a",
      storageBucket: "kakeibo-cea1a.firebasestorage.app",
      messagingSenderId: "629767950385",
      appId: "1:629767950385:web:bef5465fe6e8bf721fc510",
      measurementId: "G-458217LM1C"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let goodsData = [
      { id: '1', title: '飲料水 (1人1日3L × 3日分)', checked: true },
      { id: '2', title: '非常食 (アルファ化米・缶詰等)', checked: true },
      { id: '3', title: '携帯ラジオ & 予備電池', checked: false },
      { id: '4', title: '救急箱・常用薬', checked: false },
      { id: '5', title: 'モバイルバッテリー', checked: true }
    ];

    let taskData = [
      { id: '1', title: '家具の転倒防止器具の取り付け', detail: '背の高い本棚とタンスにL字金具を取り付ける', url: 'https://www.fdma.go.jp/' }
    ];

    // ログイン状態の監視
    auth.onAuthStateChanged((user) => {
      const loginContainer = document.getElementById('login-container');
      const appContainer = document.getElementById('app-container');

      if (user) {
        // ログインしている場合：ログイン画面を隠し、アプリを表示
        loginContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        document.getElementById('user-display-name').textContent = user.email;
        renderGoods();
        renderTasks();
      } else {
        // ログインしていない場合：アプリを隠し、ログイン画面を表示
        loginContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
      }
    });

    // Googleログインボタン
    document.getElementById('google-login-btn').addEventListener('click', () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch((error) => {
        alert("ログインエラー: " + error.message);
      });
    });

    // ログアウトボタン
    document.getElementById('logout-btn').addEventListener('click', () => {
      auth.signOut();
    });

    // タブ切り替え
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      event.currentTarget.classList.add('active');
    }

    // 備蓄品描画
    function renderGoods() {
      const listEl = document.getElementById('goods-list');
      const checkedCount = goodsData.filter(g => g.checked).length;
      document.getElementById('goods-count').textContent = `${checkedCount}/${goodsData.length}`;

      listEl.innerHTML = goodsData.map(item => `
        <div class="bg-dark-card p-3.5 rounded-xl border border-slate-800 flex items-center justify-between transition hover:border-slate-700">
          <label class="flex items-center gap-3 cursor-pointer flex-1 select-none">
            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleGoods('${item.id}')" class="w-5 h-5 rounded accent-emerald-500 cursor-pointer">
            <span class="text-sm font-medium ${item.checked ? 'line-through text-slate-500' : 'text-slate-200'}">${escapeHtml(item.title)}</span>
          </label>
          <button onclick="deleteGoods('${item.id}')" class="text-slate-600 hover:text-red-400 p-1 transition">
            <i class="fa-solid fa-trash-can text-sm"></i>
          </button>
        </div>
      `).join('');
    }

    function toggleGoods(id) {
      const item = goodsData.find(g => g.id === id);
      if (item) item.checked = !item.checked;
      renderGoods();
    }

    function addGoodsItem() {
      const input = document.getElementById('new-goods-input');
      const val = input.value.trim();
      if (!val) return;
      goodsData.push({ id: Date.now().toString(), title: val, checked: false });
      input.value = '';
      renderGoods();
    }

    function deleteGoods(id) {
      goodsData = goodsData.filter(g => g.id !== id);
      renderGoods();
    }

    // 課題描画
    function renderTasks() {
      const listEl = document.getElementById('tasks-list');
      if (taskData.length === 0) {
        listEl.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">課題項目がありません</p>';
        return;
      }
      listEl.innerHTML = taskData.map(t => `
        <div class="bg-dark-card p-4 rounded-xl border border-slate-800 space-y-2">
          <div class="flex justify-between items-start">
            <h3 class="font-bold text-slate-200 text-sm">${escapeHtml(t.title)}</h3>
            <button onclick="deleteTask('${t.id}')" class="text-slate-600 hover:text-red-400 p-1 transition">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
          ${t.detail ? `<p class="text-xs text-slate-400">${escapeHtml(t.detail)}</p>` : ''}
          ${t.url ? `
            <div class="pt-1 text-xs">
              <span class="text-slate-500 block mb-0.5"><i class="fa-solid fa-link"></i> 関連URL:</span>
              <a href="${escapeHtml(t.url)}" target="_blank" rel="noopener noreferrer" class="text-emerald-400 hover:underline word-break-all block">
                ${escapeHtml(t.url)}
              </a>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function openTaskModal() {
      document.getElementById('task-title').value = '';
      document.getElementById('task-detail').value = '';
      document.getElementById('task-url').value = '';
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function closeTaskModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    function saveTask() {
      const title = document.getElementById('task-title').value.trim();
      const detail = document.getElementById('task-detail').value.trim();
      const url = document.getElementById('task-url').value.trim();
      if (!title) return alert('タイトルを入力してください');

      taskData.unshift({ id: Date.now().toString(), title, detail, url });
      renderTasks();
      closeTaskModal();
    }

    function deleteTask(id) {
      taskData = taskData.filter(t => t.id !== id);
      renderTasks();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
</html>
