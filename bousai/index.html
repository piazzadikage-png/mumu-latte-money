<!--
=====================================================================
 Firebase Authentication ログインゲート 組み込みスニペット
=====================================================================
使い方：
1. あなたの bousai-app.html を開く
2. <body> の一番最初の行のすぐ後ろに、下記「① 貼り付けるHTML」を貼り付ける
3. #app の外側を包む形にするので、既存の
     <div id="app"> ... </div>
   をそのまま残したまま、その周りに #authGate と #appWrap を追加する
4. </body> の直前（既存の <script> タグより後）に「② 貼り付けるJS」を追加する
5. YOUR_FIREBASE_CONFIG と ALLOWED_EMAILS をあなたの情報に書き換える
6. 既存コードの一番下にある
     renderAll();
   という1行だけを削除する（ログイン成功後にこちらのスクリプトが呼び出します）
=====================================================================
-->

<!-- ① 貼り付けるHTML（<body> の直後、既存の <div id="app"> の外側に配置） -->

<div id="authGate" style="
  position:fixed;inset:0;background:#151F29;color:#F5F1E6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
  z-index:999;text-align:center;padding:24px;">
  <div style="font-size:15px;font-weight:800;letter-spacing:.05em;">防災ファイル</div>
  <div id="authStatus" style="font-size:13px;color:#B9C3CC;">サインインしてください</div>
  <button id="googleLoginBtn" style="
    padding:12px 22px;border-radius:10px;border:none;background:#2A7F62;
    color:#fff;font-weight:700;font-size:14px;">Googleでログイン</button>
</div>

<div id="appWrap" style="display:none;">
  <!-- ここに既存の <div id="app"> ...(トップバー・コンテンツ・タブバー)... </div> をそのまま入れる -->
</div>


<!-- ② 貼り付けるJS（既存の <script> の後、</body> の直前） -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ★①手順4で取得した firebaseConfig をそのまま貼り付ける
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // ★ここにログインを許可したいメールアドレスを列挙する（Googleアカウントのメール）
  const ALLOWED_EMAILS = [
    "your-address@gmail.com",
    "partner-address@gmail.com"
  ];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const authGate = document.getElementById('authGate');
  const appWrap = document.getElementById('appWrap');
  const authStatus = document.getElementById('authStatus');

  document.getElementById('googleLoginBtn').onclick = () => {
    signInWithPopup(auth, provider).catch(err => {
      authStatus.textContent = 'ログインに失敗しました: ' + err.message;
    });
  };

  let appStarted = false;

  onAuthStateChanged(auth, (user) => {
    if (user && ALLOWED_EMAILS.includes(user.email)) {
      // 許可されたメールアドレス → アプリを表示
      authGate.style.display = 'none';
      appWrap.style.display = '';
      if (!appStarted) {
        appStarted = true;
        // 既存のアプリ描画関数を呼び出す（元コードの末尾の renderAll(); の代わり）
        if (typeof renderAll === 'function') renderAll();
      }
    } else if (user) {
      // ログインはできたが許可リストにないメールアドレス → 拒否してサインアウト
      authStatus.textContent = 'このメールアドレスは登録されていません: ' + user.email;
      appWrap.style.display = 'none';
      authGate.style.display = 'flex';
      signOut(auth);
    } else {
      // 未ログイン
      appWrap.style.display = 'none';
      authGate.style.display = 'flex';
      authStatus.textContent = 'サインインしてください';
    }
  });
</script>
