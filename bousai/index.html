<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>防災アプリ</title>
<style>
:root{
  --ink:#1C2B3A;
  --ink-soft:#4C5A68;
  --paper:#EFEDE4;
  --paper2:#E3E0D2;
  --card:#FFFDF8;
  --yellow:#F5C400;
  --red:#D62828;
  --red-dark:#8C1C1C;
  --teal:#2A7F62;
  --coral:#E8834F;
  --line:#C9C4B4;
  --radius:10px;
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Roboto Mono", monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--paper);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);}
.hazard-stripe{
  height:7px;flex:none;
  background:repeating-linear-gradient(135deg, var(--yellow) 0 12px, #1C2B3A 12px 24px);
}

#topbar{
  padding:14px 16px 12px;
  background:var(--paper2);
  border-bottom:1px solid var(--line);
  flex:none;
}
.mode-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-mark{
  width:30px;height:30px;flex:none;border-radius:6px;
  background:var(--ink);display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{width:18px;height:18px;stroke:var(--yellow);}
.brand-text{font-weight:800;letter-spacing:.04em;font-size:15px;}
.brand-sub{font-size:10px;color:var(--ink-soft);letter-spacing:.08em;font-family:var(--font-mono);}

#content{flex:1;overflow-y:auto;padding:14px 16px 100px;}
.section-title{
  font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin:18px 0 8px;display:flex;align-items:center;gap:8px;
}
.section-title:first-child{margin-top:0;}
.section-title .num{
  font-family:var(--font-mono);background:var(--ink);color:var(--yellow);
  font-size:10px;padding:2px 6px;border-radius:4px;letter-spacing:0;
}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;
}
.card.tight{padding:10px 12px;}

.callout{
  border-radius:var(--radius);padding:12px 12px 12px 14px;margin:10px 0;
  display:flex;gap:10px;align-items:flex-start;border-left:6px solid;
  background:#FFF6D8;border-color:var(--yellow);color:#5c4a00;
}
.callout svg{width:20px;height:20px;flex:none;margin-top:1px;stroke:#8a6d00;}
.callout .t{font-weight:800;font-size:12px;letter-spacing:.03em;margin-bottom:2px;}
.callout .d{font-size:13px;line-height:1.5;}
.callout.danger{background:#FCE1DE;border-color:var(--red);color:var(--red-dark);}
.callout.danger svg{stroke:var(--red-dark);}

#tabbar{
  flex:none;display:flex;background:var(--ink);border-top:3px solid var(--yellow);
  position:sticky;bottom:0;z-index:10;
}
.tab-btn{
  flex:1;border:none;background:transparent;color:#9AA7B2;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;font-size:10px;font-weight:700;letter-spacing:.02em;
  border-top:3px solid transparent;margin-top:-3px;
}
.tab-btn svg{width:18px;height:18px;stroke:#9AA7B2;}
.tab-btn.active{color:var(--yellow);border-top-color:var(--yellow);}
.tab-btn.active svg{stroke:var(--yellow);}

.field{margin-bottom:10px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.03em;}
.field input[type=text],.field input[type=tel],.field input[type=number],
.field input[type=date],.field input[type=url],.field select,.field textarea{
  width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:14px;
}
.field textarea{min-height:64px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qty-stepper{display:flex;align-items:center;gap:6px;}
.qty-stepper button{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper);font-size:16px;font-weight:800;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.qty-stepper button svg{width:14px;height:14px;stroke:var(--ink);stroke-width:2.5;}
.qty-val{font-family:var(--font-mono);font-size:15px;font-weight:800;color:var(--ink);min-width:22px;text-align:center;}

.toggle{position:relative;width:44px;height:24px;flex:none;}
.toggle input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2;}
.toggle .track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;}
.toggle .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;}
.toggle input:checked + .track{background:var(--teal);}
.toggle input:checked + .track + .knob{transform:translateX(20px);}

.pill-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;
}
.pill-btn.active{background:var(--ink);color:var(--yellow);border-color:var(--ink);}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}

.btn{
  border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:9px 14px;font-size:13px;font-weight:700;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);}
.btn.danger{background:transparent;color:var(--red-dark);border-color:var(--red);}
.btn.block{width:100%;}

.btn-action-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.btn-dashed-add {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 16px;
  border-radius: 14px;
  border: 1.5px dashed #4b83d6;
  background: rgba(35, 60, 95, 0.1);
  color: #3b74ca;
  font-weight: 700;
  font-size: 13.5px;
}
.btn-subtle-cat {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 11px 16px;
  border-radius: 14px;
  border: 1px solid rgba(130, 150, 180, 0.3);
  background: rgba(45, 60, 80, 0.08);
  color: #4a5c70;
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
}

.stock-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:8px;
}
.stock-item.done{border-left:4px solid var(--teal);}
.stock-item.pending{border-left:4px solid var(--line);}
.stock-item.expiring{border-left:4px solid var(--red);}
.stock-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.stock-name{font-weight:800;font-size:14px;}
.stock-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.tag{
  font-size:10px;font-family:var(--font-mono);padding:2px 7px;border-radius:5px;
  background:var(--paper2);color:var(--ink-soft);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:3px;
}
.tag.exp{background:#FCE1DE;color:var(--red-dark);border-color:var(--red);}
.stock-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.stock-actions{display:flex;gap:6px;}
.icon-btn{
  border:1px solid var(--line);background:var(--paper);border-radius:8px;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:15px;height:15px;stroke:var(--ink-soft);}

.phase{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;background:var(--card);}
.phase-head{
  width:100%;border:none;background:var(--paper2);padding:13px 14px;
  display:flex;justify-content:space-between;align-items:center;text-align:left;
}
.phase-head .ttl{font-weight:800;font-size:14px;}
.phase-head .sub{font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);margin-top:2px;}
.phase-head .chev{width:16px;height:16px;stroke:var(--ink-soft);transition:.2s;flex:none;}
.phase.open .chev{transform:rotate(180deg);}
.progressbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px;}
.progressbar .fill{height:100%;background:var(--teal);}
.phase-body{display:none;padding:12px 14px 14px;}
.phase.open .phase-body{display:block;}

.chk-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.chk-item:last-child{border-bottom:none;}
.chk-content{flex:1;}
.chk-text{font-size:13.5px;line-height:1.5;margin-bottom:6px;}
.chk-checks{display:flex;gap:16px;align-items:center;}
.user-chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;}
.user-chk input{width:17px;height:17px;accent-color:var(--teal);cursor:pointer;}

.map-upload{
  border:2px dashed var(--line);border-radius:var(--radius);padding:16px;text-align:center;
  position:relative;background:var(--paper2);margin-top:8px;
}
.map-upload input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.map-upload svg{width:26px;height:26px;stroke:var(--ink-soft);margin-bottom:6px;}
.map-preview{width:100%;border-radius:8px;margin-top:10px;border:1px solid var(--line);max-height:240px;object-fit:cover;}

.empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13px;}

.task-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;
}
.task-item.done{opacity:0.6;background:var(--paper2);}
.task-item.done .task-title{text-decoration:line-through;}
.task-title{font-weight:800;font-size:14px;margin-bottom:2px;}
.task-desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
.task-url{
  font-size:12px;color:var(--teal);word-break:break-all;overflow-wrap:anywhere;
  display:inline-flex;align-items:flex-start;gap:4px;text-decoration:underline;
  max-width:100%;
}
.task-url svg{width:14px;height:14px;flex:none;margin-top:2px;}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

<div id="authGate" style="
  position:fixed;inset:0;background:#151F29;color:#F5F1E6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;
  z-index:999;text-align:center;padding:24px;">
  <div style="font-size:15px;font-weight:800;letter-spacing:.05em;">防災アプリ</div>
  <div id="authStatus" style="font-size:13px;color:#B9C3CC;">サインインしてください</div>
  <button id="googleLoginBtn" style="
    padding:12px 22px;border-radius:10px;border:none;background:#2A7F62;
    color:#fff;font-weight:700;font-size:14px;">Googleでログイン</button>
</div>

<div id="appWrap" style="display:none;">
<div id="app">
  <div class="hazard-stripe"></div>
  <div id="topbar">
    <div class="mode-row">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
        </div>
        <div>
          <div class="brand-text">防災アプリ</div>
          <div class="brand-sub">DISASTER / 震度7 対応</div>
        </div>
      </div>
    </div>
  </div>
  <div id="content"></div>
  <div id="tabbar"></div>
</div>
</div>

<script>
const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>',
  box:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
  list:'<path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/>',
  map:'<path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2z"/><path d="M9 3v16"/><path d="M15 5v16"/>',
  checkSquare:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  chevron:'<path d="M6 9l6 6 6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/>',
  warn:'<path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5"/><path d="M12 18h.01"/>',
  danger:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>',
  trash:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 14h10l1-14"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'
};
function icon(name, cls){return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls||''}">${ICONS[name]}</svg>`;}

const STORAGE_KEY = 'bousai_app_v6';

function defaultState(){
  return {
    tab:'home',
    openPhase:'p1',
    filter:'all',
    categories:[
      {key:'human', label:'人間用食料'},
      {key:'hygiene', label:'衛生用品'},
      {key:'infra', label:'電源・インフラ対策'},
      {key:'other', label:'その他'},
    ],
    stock:[
      {id:'s1', name:'現金（10円・100円玉含む）', category:'infra', have:false, need:1, cur:0, expiry:'', note:'公衆電話用含む'},
      {id:'s2', name:'身分証明書のコピー', category:'infra', have:false, need:1, cur:0, expiry:'', note:'免許証・保険証等のコピー'},
      {id:'s3', name:'モバイルバッテリー＆充電ケーブル', category:'infra', have:false, need:2, cur:0, expiry:'', note:'満充電を常時維持'},
      {id:'s4', name:'防災ラジオ', category:'infra', have:false, need:1, cur:0, expiry:'', note:'手回し充電式または乾電池式'},
      {id:'s5', name:'連絡先メモ', category:'infra', have:false, need:1, cur:0, expiry:'', note:'家族や親族の電話番号メモ'},
      {id:'s6', name:'救急セット・常備薬', category:'hygiene', have:false, need:1, cur:0, expiry:'', note:'絆創膏、消毒液、常備薬、包帯など'},
      {id:'s7', name:'マスク', category:'hygiene', have:false, need:1, cur:0, expiry:'', note:'感染症・粉塵予防'},
      {id:'s8', name:'除菌ウェットティッシュ', category:'hygiene', have:false, need:2, cur:0, expiry:'', note:'手拭き・身の回り衛生'},
      {id:'s9', name:'携帯トイレ・簡易トイレ（凝固剤）', category:'hygiene', have:false, need:30, cur:0, expiry:'', note:'便器にポリ袋＋凝固剤（多めに備蓄）'},
      {id:'s10', name:'生理用品', category:'hygiene', have:false, need:1, cur:0, expiry:'', note:''},
      {id:'s11', name:'歯ブラシセット・液体ハミガキ', category:'hygiene', have:false, need:1, cur:0, expiry:'', note:''},
      {id:'s12', name:'懐中電灯・ヘッドライト', category:'infra', have:false, need:2, cur:0, expiry:'', note:'寝室と玄関・持ち出し袋に配置'},
      {id:'s13', name:'予備の乾電池', category:'infra', have:false, need:2, cur:0, expiry:'', note:'機器に合わせたサイズ'},
      {id:'s14', name:'ホイッスル（笛）', category:'infra', have:false, need:2, cur:0, expiry:'', note:'閉じ込め時の救助要請用'},
      {id:'s15', name:'万能ナイフ・多機能ツール', category:'infra', have:false, need:1, cur:0, expiry:'', note:''},
      {id:'s16', name:'レインウェア（雨具）', category:'infra', have:false, need:2, cur:0, expiry:'', note:''},
      {id:'s17', name:'防寒シート（アルミブランケット）', category:'infra', have:false, need:2, cur:0, expiry:'', note:''},
      {id:'s18', name:'軍手・作業用手袋', category:'infra', have:false, need:2, cur:0, expiry:'', note:'瓦礫・ガラス対策'},
      {id:'s19', name:'着替え（下着・靴下・衣類）', category:'infra', have:false, need:2, cur:0, expiry:'', note:''},
      {id:'s20', name:'飲料水（持ち出し500ml＆備蓄2L）', category:'human', have:false, need:12, cur:0, expiry:'', note:'1人1日3L目安・3日〜1週間分'},
      {id:'s21', name:'非常食（アルファ化米・缶詰・ゼリー等）', category:'human', have:false, need:9, cur:0, expiry:'', note:'3日〜1週間分・調理不要食品含む'},
      {id:'s22', name:'カセットコンロ＆カセットボンベ', category:'infra', have:false, need:1, cur:0, expiry:'', note:'熱源確保・ボンベは最低6本'},
      {id:'s23', name:'給水タンク・折りたたみ給水袋', category:'infra', have:false, need:1, cur:0, expiry:'', note:'断水時の給水用'},
      {id:'s24', name:'トイレットペーパー・ティッシュ', category:'hygiene', have:false, need:2, cur:0, expiry:'', note:''},
      {id:'s25', name:'からだふきシート・水のいらないシャンプー', category:'hygiene', have:false, need:2, cur:0, expiry:'', note:''},
      {id:'s26', name:'ラップ・紙皿・紙コップ・カトラリー', category:'hygiene', have:false, need:1, cur:0, expiry:'', note:'食器にかぶせて節水'},
      {id:'s27', name:'ゴミ袋（大きめの黒袋・消臭袋）', category:'hygiene', have:false, need:2, cur:0, expiry:'', note:'多目的・目隠し・廃棄物処理用'},
      {id:'s28', name:'ランタン（部屋全体照明用）', category:'infra', have:false, need:1, cur:0, expiry:'', note:''},
      {id:'s29', name:'ポータブル電源／ソーラーパネル', category:'infra', have:false, need:1, cur:0, expiry:'', note:''}
    ],
    tasks:[
      {id:'t1', title:'家具の転倒防止固定', desc:'寝室やリビングの大型家具を耐震突っ張り棒やL字金具で固定する', url:'', done:false},
      {id:'t2', title:'ガラス飛散防止フィルムの貼付', desc:'窓ガラスや食器棚のガラス面への飛散防止フィルム施工', url:'', done:false},
      {id:'t3', title:'家族の安信用伝言ダイヤルの確認', desc:'災害用伝言ダイヤル（171）の利用方法を家族で確認しておく', url:'https://www.ntt-east.co.jp/saigai/voice171/', done:false}
    ],
    actionChecks:{},
    evac:{
      home:'マンション（在宅避難を優先）',
      primaryName:'〇〇近隣公園', primaryAddress:'徒歩3分 / 集合ポイント', primaryRule:'火事がない限りまずはここに夫婦で合流',
      shelterName:'〇〇小学校 Gymnasium', shelterAddress:'〇〇市〇〇町1-2-3', shelterTel:'03-0000-0000', shelterPetRule:'ペット同行避難可（ケージ要・受付で確認）',
      routeText:'大通りを避け、崩落の恐れのあるブロック塀の横を通らないこと。', mapImage:null
    }
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
var state = loadState();
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid(){ return 'id'+Math.random().toString(36).slice(2,9); }

const PHASES = [
  {

function getCategoryLabel(key){
  const c = state.categories.find(x=>x.key===key);
  return c ? c.label : 'その他';
}

function isExpiringSoon(dateStr){
  if(!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  const diff = (d - now)/(1000*60*60*24);
  return diff >= 0 && diff <= 30;
}
function isExpired(dateStr){
  if(!dateStr) return false;
  return new Date(dateStr) < new Date(new Date().toDateString());
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

  {key:'pending', label:'未準備のみ'},
  {key:'soon', label:'期限間近(30日)'}
];

function renderStock(){
  let items = state.stock.slice();
  if(state.filter==='pending') items = items.filter(s=>!s.have);
  else if(state.filter==='soon') items = items.filter(s=>isExpiringSoon(s.expiry));

  const total = state.stock.length;
  const done = state.stock.filter(s=>s.have).length;
  const soonOrExpired = state.stock.filter(s=>isExpiringSoon(s.expiry) || isExpired(s.expiry)).length;
  const pct = total ? Math.round(done/total*100) : 0;

  let html = `
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:12px;color:var(--ink-soft)">備蓄完了ステータス</div>
          <div style="font-size:18px;font-weight:900;margin-top:2px;">${done} / ${total} 品目準備OK ${soonOrExpired > 0 ? `<span style="color:var(--red);font-size:12px;margin-left:4px;">(期限切れ近接: ${soonOrExpired}件)</span>` : ''}</div>
        </div>
        <div style="font-size:24px;font-weight:900;color:${done===total&&total>0?'var(--teal)':'var(--ink-soft)'}">${pct}%</div>
      </div>
      <div class="progressbar" style="margin-top:8px;"><div class="fill" style="width:${pct}%"></div></div>
    </div>
  `;

  html += `<div class="filter-row">${STOCK_FILTERS.map(f=>`<button class="pill-btn ${state.filter===f.key?'active':''}" data-filter="${f.key}">${f.label}</button>`).join('')}</div>`;
  
  html += `
    <div class="btn-action-row">
      <button class="btn-dashed-add" id="addStockBtn">＋ アイテムを追加</button>
      <button class="btn-subtle-cat" id="manageCatBtn">カテゴリー管理</button>
    </div>
  `;

  if(!items.length){
    html += `<div class="empty">該当するアイテムがありません</div>`;
  }

  items.forEach(s=>{
    const expired = isExpired(s.expiry);
    const soon = isExpiringSoon(s.expiry);
    const cls = expired||soon ? 'expiring' : (s.have?'done':'pending');
    const expiryText = s.expiry ? `期限 ${s.expiry}` : '期限 未定';
    html += `
      <div class="stock-item ${cls}" data-id="${s.id}">
        <div class="stock-head">
          <div>
            <div class="stock-name">${escapeHtml(s.name)}</div>
            <div class="stock-tags">
              <span class="tag">${getCategoryLabel(s.category)}</span>
              <span class="tag ${soon||expired?'exp':''}">${expiryText}</span>
            </div>
            ${s.note?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">${escapeHtml(s.note)}</div>`:''}
          </div>
          <div class="toggle">
            <input type="checkbox" class="haveToggle" ${s.have?'checked':''}>
            <div class="track"></div><div class="knob"></div>
          </div>
        </div>
        <div class="stock-meta">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <div style="font-size:12px;font-weight:700;color:var(--ink-soft);">必要数: <span style="font-family:var(--font-mono);color:var(--ink);">${s.need}</span></div>
            <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-soft);">
              <span>所持数:</span>
              <span class="qty-val curVal">${s.cur}</span>
              <div class="qty-stepper">
                <button class="qtyMinus" aria-label="減らす">${icon('minus')}</button>
                <button class="qtyPlus" aria-label="増やす">${icon('plus')}</button>
              </div>
            </div>
          </div>
          <div class="stock-actions">
            <button class="icon-btn editBtn">${icon('list')}</button>
            <button class="icon-btn delBtn">${icon('trash')}</button>
          </div>
        </div>
      </div>
    `;
  });

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('[data-filter]').forEach(b=>{
    b.onclick = ()=>{ state.filter=b.dataset.filter; save(); renderStock(); };
  });
  document.getElementById('addStockBtn').onclick = ()=> openStockForm(null);
  document.getElementById('manageCatBtn').onclick = ()=> openCategoryManager();

  document.querySelectorAll('.stock-item').forEach(node=>{
    const id = node.dataset.id;
    const item = state.stock.find(x=>x.id===id);
    const haveToggle = node.querySelector('.haveToggle');
    const curValEl = node.querySelector('.curVal');

    haveToggle.onchange = e=>{ item.have=e.target.checked; save(); renderStock(); };

    const updateQty = (newVal)=>{
      item.cur = Math.max(0, newVal);
      if(curValEl) curValEl.textContent = item.cur;
      item.have = item.need > 0 && item.cur >= item.need;
      if(haveToggle) haveToggle.checked = item.have;
      if(item.have) node.classList.add('done'); else node.classList.remove('done');
      save();
    };

    node.querySelector('.qtyPlus').onclick = ()=> updateQty(item.cur + 1);
    node.querySelector('.qtyMinus').onclick = ()=> updateQty(item.cur - 1);
    node.querySelector('.editBtn').onclick = ()=> openStockForm(item);
    node.querySelector('.delBtn').onclick = ()=>{
      showConfirmModal(`「${item.name}」を削除しますか？`, ()=>{
        state.stock = state.stock.filter(x=>x.id!==id); save(); renderStock();
      });
    };
  });
}

      </div>

      <div class="field"><label>メモ / 保管場所</label><textarea id="f_note" placeholder="例: リビングクローゼット奥">${escapeHtml(draft.note)}</textarea></div>
      <div style="display:flex;gap:8px;margin-top:6px;">

        <button class="btn primary block" id="f_save">保存する</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.querySelector('#f_cancel').onclick = ()=> wrap.remove();
  wrap.querySelector('#f_save').onclick = ()=>{
    draft.name = wrap.querySelector('#f_name').value.trim() || '無題アイテム';
    draft.category = wrap.querySelector('#f_cat').value;
    draft.need = parseInt(wrap.querySelector('#f_need').value)||0;

    draft.have = draft.cur >= draft.need && draft.need>0 ? true : draft.have;
    if(isNew) state.stock.push(draft);
    else Object.assign(item, draft);
    save(); wrap.remove(); renderStock();
  };
}

function openCategoryManager(){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;';
  
  function renderContent(){
    return `
      <div style="background:var(--paper);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px 24px;max-height:88vh;overflow-y:auto;color:var(--ink);">
        <div class="section-title" style="margin-top:0;">カテゴリー管理</div>
        <div style="margin-bottom:12px;">
          ${state.categories.map((c,idx)=>`
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
              <input type="text" class="catInput" data-idx="${idx}" value="${escapeHtml(c.label)}" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);">
              <button class="btn danger delCatBtn" data-idx="${idx}" style="padding:6px 10px;">削除</button>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <input type="text" id="newCatName" placeholder="新しいカテゴリー名" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);">
          <button class="btn primary" id="addCatBtn">追加</button>
        </div>
        <button class="btn block primary" id="closeCatModal">完了</button>
      </div>
    `;
  }
  
  wrap.innerHTML = renderContent();
  document.body.appendChild(wrap);

  function bindEvents(){
    wrap.querySelectorAll('.catInput').forEach(inp=>{
      inp.onchange = e=>{ state.categories[e.target.dataset.idx].label = e.target.value; save(); };
    });
    wrap.querySelectorAll('.delCatBtn').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = parseInt(btn.dataset.idx);
        state.categories.splice(idx, 1);
        save();
        wrap.innerHTML = renderContent();
        bindEvents();
      };
    });
    const addBtn = wrap.querySelector('#addCatBtn');
    if(addBtn){
      addBtn.onclick = ()=>{
        const val = wrap.querySelector('#newCatName').value.trim();
        if(val){
          state.categories.push({key:uid(), label:val});
          save();
          wrap.innerHTML = renderContent();
          bindEvents();
        }
      };
    }
    const closeBtn = wrap.querySelector('#closeCatModal');
    if(closeBtn){
      closeBtn.onclick = ()=>{ wrap.remove(); renderStock(); };
    }
  }
  bindEvents();
}

function renderAction(){
  let html = `<div class="section-title"><span class="num">ACTION</span>🚨 震度7発生時のアクションプラン・チェックリスト</div>`;

  PHASES.forEach(p=>{
    const isOpen = state.openPhase === p.key;
    const total = p.items.length * 2;
    let checkedCount = 0;
    p.items.forEach(item=>{
      const chk = state.actionChecks[item.id] || {naoki:false, yumiko:false};
      if(chk.naoki) checkedCount++;
      if(chk.yumiko) checkedCount++;
    });
    const pct = total ? Math.round(checkedCount/total*100) : 0;

    html += `
      <div class="phase ${isOpen?'open':''}" data-key="${p.key}">
        <button class="phase-head" style="align-items:center;">
          <div style="flex:1; text-align:left; min-width:0;">
            <div class="ttl" style="word-break:break-all;">${p.title}</div>
            <div class="sub">${p.sub} （完了: ${checkedCount}/${total}）</div>
          </div>
          ${icon('chevron', 'chev')}
        </button>
        <div class="phase-body">
          <div class="progressbar" style="margin-bottom:12px;"><div class="fill" style="width:${pct}%"></div></div>
          ${(p.warnings||[]).map(w=>`
            <div class="callout ${w.type}">
              ${icon(w.type==='danger'?'danger':'warn')}
              <div><div class="t">${w.title}</div><div class="d">${w.body}</div></div>
            </div>
          `).join('')}
          <div>
            ${p.items.map(item=>{
              const chk = state.actionChecks[item.id] || {naoki:false, yumiko:false};
              return `
                <div class="chk-item">
                  <div class="chk-content">
                    <div class="chk-text">${item.text}</div>
                    <div class="chk-checks">
                      <label class="user-chk">
                        <input type="checkbox" class="actChkUser" data-id="${item.id}" data-user="naoki" ${chk.naoki?'checked':''}> Naoki
                      </label>
                      <label class="user-chk">
                        <input type="checkbox" class="actChkUser" data-id="${item.id}" data-user="yumiko" ${chk.yumiko?'checked':''}> Yumiko
                      </label>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  });

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('.phase-head').forEach(head=>{
    head.onclick = ()=>{
      const p = head.closest('.phase');
      const k = p.dataset.key;
      state.openPhase = state.openPhase === k ? null : k;
      save(); renderAction();
    };
  });

  document.querySelectorAll('.actChkUser').forEach(chk=>{
    chk.onchange = e=>{
      const id = chk.dataset.id;
      const user = chk.dataset.user;
      if(!state.actionChecks[id]) state.actionChecks[id] = {naoki:false, yumiko:false};
      state.actionChecks[id][user] = e.target.checked;
      save(); renderAction();
    };
  });
}

      <div style="font-weight:800;font-size:14px;margin-bottom:10px;">① 一次集合場所（近くの公園など）</div>
      <div class="field"><label>名称</label><input type="text" id="ev_pName" value="${escapeHtml(e.primaryName)}" placeholder="例: 〇〇公園"></div>
      <div class="field"><label>住所 / 目印</label><input type="text" id="ev_pAddr" value="${escapeHtml(e.primaryAddress)}" placeholder="例: 時計台の下"></div>
      <div class="field"><label>集合ルールメモ</label><textarea id="ev_pRule" placeholder="例: 震度6以上で自動的にここに合流">${escapeHtml(e.primaryRule)}</textarea></div>
    </div>

    <div class="card">
      <div style="font-weight:800;font-size:14px;margin-bottom:10px;">② 指定避難所（学校など）</div>
      <div class="field"><label>避難所名</label><input type="text" id="ev_sName" value="${escapeHtml(e.shelterName)}" placeholder="例: 〇〇小学校"></div>
      <div class="field"><label>住所</label><input type="text" id="ev_sAddr" value="${escapeHtml(e.shelterAddress)}" placeholder="例: 〇〇町1-2-3"></div>
      <div class="field"><label>電話番号</label><input type="tel" id="ev_sTel" value="${escapeHtml(e.shelterTel)}" placeholder="例: 03-XXXX-XXXX"></div>
      <div class="field"><label>ペット同行ルール</label><textarea id="ev_sPet" placeholder="例: ケージ必須、飼育場所は体育館外">${escapeHtml(e.shelterPetRule)}</textarea></div>
    </div>

    <div class="card">
      <div style="font-weight:800;font-size:14px;margin-bottom:10px;">③ 避難ルート・道順メモ</div>
      <div class="field"><textarea id="ev_route" placeholder="例: 狭い路地は通り危険。大通りの歩道を通る">${escapeHtml(e.routeText)}</textarea></div>
      <div style="font-size:11px;font-weight:700;color:var(--ink-soft);margin-top:6px;">紙の防災マップ写真 / スクショ画像</div>
      <div class="map-upload">
        ${icon('cam')}
        <div style="font-size:12px;font-weight:700;">タップして画像を選択・保存</div>
        <input type="file" id="mapFileInput" accept="image/*">
      </div>
      ${e.mapImage ? `<img src="${e.mapImage}" class="map-preview">` : ''}
    </div>

    <button class="btn primary block" id="saveEvacBtn" style="margin-top:12px;">避難所情報を保存</button>
  `;

  document.getElementById('content').innerHTML = html;

  document.getElementById('saveEvacBtn').onclick = ()=>{
    state.evac.primaryName = document.getElementById('ev_pName').value;
    state.evac.primaryAddress = document.getElementById('ev_pAddr').value;
    state.evac.primaryRule = document.getElementById('ev_pRule').value;
    state.evac.shelterName = document.getElementById('ev_sName').value;
    state.evac.shelterAddress = document.getElementById('ev_sAddr').value;
    state.evac.shelterTel = document.getElementById('ev_sTel').value;
    state.evac.shelterPetRule = document.getElementById('ev_sPet').value;
    state.evac.routeText = document.getElementById('ev_route').value;
    save();
    const b = document.getElementById('saveEvacBtn');
    b.textContent = '保存しました！';
    setTimeout(()=>b.textContent='避難所情報を保存', 1500);
  };

  document.getElementById('mapFileInput').onchange = e=>{
    const file = e.target.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = ev=>{
        state.evac.mapImage = ev.target.result;
        save(); renderEvac();
      };
      reader.readAsDataURL(file);
    }
  };
}

function renderTasks(){
  let html = `<div class="section-title"><span class="num">TASKS</span>防災課題・事前準備リスト</div>`;

  html += `
    <div class="btn-action-row">
      <button class="btn-dashed-add" id="addTaskBtn">＋ 課題・準備項目を追加</button>
    </div>
  `;

  if(!state.tasks.length){
    html += `<div class="empty">登録されている課題はありません</div>`;
  }

  state.tasks.forEach(t=>{
    html += `
      <div class="task-item ${t.done?'done':''}" data-id="${t.id}">
        <div class="toggle" style="margin-top:2px;">
          <input type="checkbox" class="taskToggle" ${t.done?'checked':''}>
          <div class="track"></div><div class="knob"></div>
        </div>
        <div style="flex:1;min-width:0;">
          <div class="task-title">${escapeHtml(t.title)}</div>
          ${t.desc?`<div class="task-desc">${escapeHtml(t.desc)}</div>`:''}
          ${t.url?`<a href="${escapeHtml(t.url)}" target="_blank" rel="noopener noreferrer" class="task-url">${icon('link')}<span style="word-break:break-all;overflow-wrap:anywhere;">${escapeHtml(t.url)} ↗</span></a>`:''}
        </div>
        <button class="icon-btn taskDelBtn" style="flex:none;">${icon('trash')}</button>
      </div>
    `;
  });

  document.getElementById('content').innerHTML = html;

  document.getElementById('addTaskBtn').onclick = ()=> openTaskForm(null);

  document.querySelectorAll('.task-item').forEach(node=>{
    const id = node.dataset.id;
    const task = state.tasks.find(x=>x.id===id);
    const toggle = node.querySelector('.taskToggle');

    toggle.onchange = e=>{
      task.done = e.target.checked;
      save(); renderTasks();
    };

    node.querySelector('.taskDelBtn').onclick = ()=>{
      showConfirmModal(`「${task.title}」を削除しますか？`, ()=>{
        state.tasks = state.tasks.filter(x=>x.id!==id);
        save(); renderTasks();
      });
    };
  });
}

function openTaskForm(task){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;';
  wrap.innerHTML = `
    <div style="background:var(--paper);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px 24px;max-height:88vh;overflow-y:auto;color:var(--ink);">
      <div class="section-title" style="margin-top:0;">防災課題・事前準備を追加</div>
      <div class="field"><label>タイトル</label><input type="text" id="t_title" placeholder="例: 家具の固定"></div>
      <div class="field"><label>詳細・メモ</label><textarea id="t_desc" placeholder="例: 寝室のタンスに耐震突っ張り棒をつける"></textarea></div>
      <div class="field"><label>関連URL（リンク）</label><input type="url" id="t_url" placeholder="https://example.com"></div>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button class="btn block" id="t_cancel">キャンセル</button>
        <button class="btn primary block" id="t_save">追加する</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.querySelector('#t_cancel').onclick = ()=> wrap.remove();
  wrap.querySelector('#t_save').onclick = ()=>{
    const title = wrap.querySelector('#t_title').value.trim();
    const desc = wrap.querySelector('#t_desc').value;
    const url = wrap.querySelector('#t_url').value.trim();
    if(title){
      state.tasks.push({id:uid(), title, desc, url, done:false});
      save(); wrap.remove(); renderTasks();
    }
  };
}

function renderAll(){
  renderTabbar();
  if(state.tab==='home') renderHome();
  else if(state.tab==='stock') renderStock();
  else if(state.tab==='action') renderAction();
  else if(state.tab==='evac') renderEvac();
  else if(state.tab==='tasks') renderTasks();
}

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // kakeibo / travel-planner と同じ手順で取得したFirebase設定
  const firebaseConfig = {
    apiKey: "AIzaSyCFBybW0jJD2iPm0-x1FDhH5qbWFBFXeSE",
    authDomain: "kakeibo-cea1a.firebaseapp.com",
    projectId: "kakeibo-cea1a",
    storageBucket: "kakeibo-cea1a.firebasestorage.app",
    messagingSenderId: "629767950385",
    appId: "1:629767950385:web:bef5465fe6e8bf721fc510",
    measurementId: "G-458217LM1C"
  };

  // ★ここにログインを許可したいGoogleアカウントのメールアドレスを列挙してください
  const ALLOWED_EMAILS = [
    "yumi0317mumu@gmail.com",
    "yumi17march@gmail.com",
    "piazzadikage@gmail.com"
  ];

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const provider = new GoogleAuthProvider();
  const db = getFirestore(fbApp);

  // 家族で共有する1つのドキュメントにすべてのデータをまとめて同期する
  const SHARED_DOC = doc(db, "bousai", "shared-data");
  let pushTimer = null;
  let rendered = false;

  // 既存の save()（localStorageへの保存）はそのまま使いつつ、
  // 呼び出されるたびにFirestoreへも書き込むよう拡張する
  const originalSave = window.save;
  window.save = function(){
    originalSave();
    clearTimeout(pushTimer);
    pushTimer = setTimeout(()=>{
      const payload = Object.assign({}, window.state, {_updatedAt: serverTimestamp()});
      setDoc(SHARED_DOC, payload).catch(err=>console.error('Firestore保存エラー', err));
    }, 500);
  };

  function startFirestoreSync(){
    onSnapshot(SHARED_DOC, (snap)=>{
      if(snap.metadata.hasPendingWrites){
        // 自分の書き込みが返ってきただけ。初回だけ描画する
        if(!rendered){ rendered = true; renderAll(); }
        return;
      }
      if(snap.exists()){
        const remote = snap.data();
        delete remote._updatedAt;
        window.state = Object.assign(defaultState(), remote);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(window.state)); }catch(e){}
      } else {
        // まだ共有データがない → 今の内容(自分の端末のデータ)を初回データとして送る
        const payload = Object.assign({}, window.state, {_updatedAt: serverTimestamp()});
        setDoc(SHARED_DOC, payload).catch(err=>console.error('Firestore初期保存エラー', err));
      }
      rendered = true;
      renderAll();
    }, (err)=>{
      console.error('Firestore同期エラー(オフラインの可能性)', err);
      if(!rendered){ rendered = true; renderAll(); } // オフライン時はローカルデータで表示
    });
  }

  const authGate = document.getElementById('authGate');
  const appWrap = document.getElementById('appWrap');
  const authStatus = document.getElementById('authStatus');

  document.getElementById('googleLoginBtn').onclick = () => {
    signInWithPopup(auth, provider).catch(err => {
      authStatus.textContent = 'ログインに失敗しました: ' + err.message;
    });
  };

  let appStarted = false;

  onAuthStateChanged(auth, (user) => {
    if (user && ALLOWED_EMAILS.includes(user.email)) {
      authGate.style.display = 'none';
      appWrap.style.display = '';
      if (!appStarted) {
        appStarted = true;
        startFirestoreSync();
      }
    } else if (user) {
      authStatus.textContent = 'このメールアドレスは登録されていません: ' + user.email;
      appWrap.style.display = 'none';
      authGate.style.display = 'flex';
      signOut(auth);
    } else {
      appWrap.style.display = 'none';
      authGate.style.display = 'flex';
      authStatus.textContent = 'サインインしてください';
    }
  });
</script>
